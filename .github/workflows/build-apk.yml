name: بناء ملف APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: بناء التطبيق
        run: gradle assembleDebug --no-daemon

      - name: تسمية الملف
        run: cp app/build/outputs/apk/debug/app-debug.apk sarat.apk

      - name: رفع الملف كإصدار للتحميل
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: سعرات - نسخة ${{ github.run_number }}
          body: حمّل ملف sarat.apk على موبايلك وثبّته.
          files: sarat.apk
