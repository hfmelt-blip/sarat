name: بناء ملف APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: بناء التطبيق
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: عرض أخطاء البناء
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong|Execution failed|> " build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: تسمية الملف
        run: cp app/build/outputs/apk/debug/app-debug.apk sarat.apk

      - name: رفع الملف كإصدار للتحميل
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: شد الهمة - نسخة ${{ github.run_number }}
          body: حمّل ملف sarat.apk على موبايلك وثبّته.
          files: sarat.apk
